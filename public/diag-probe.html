<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Evoloop JS probe</title>
  </head>
  <body style="font: 16px system-ui; max-width: 640px; margin: 2rem auto; padding: 0 1rem">
    <h1>Evoloop JS probe</h1>
    <p>
      If you can read this, HTML from this server loads. The numbered list below fills in as each
      JavaScript layer runs. Tell the developer which numbers appear.
    </p>
    <ol id="out"></ol>
    <script>
      window.__probeOk = function (s) {
        var li = document.createElement('li')
        li.textContent = s
        document.getElementById('out').appendChild(li)
      }
      __probeOk('1 inline classic <script>: OK')
    </script>
    <script src="/diag-classic.js"></script>
    <script type="module" src="/diag-module.js"></script>
  </body>
</html>
