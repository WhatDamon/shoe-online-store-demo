name: verify

on:
  push:
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned third-party actions (supply-chain hygiene); comment keeps the
      # human-readable tag. Refresh by bumping the digest + tag together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Bun is the package manager only (packageManager: bun@1.3.14); all gate
      # CLIs below run on Node, matching spec decision #18 (Next/Node runtime).
      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      # One-shot acceptance gate (package.json "verify"):
      # format:check + typecheck + lint + test.
      - run: bun run verify
