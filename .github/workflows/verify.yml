name: verify

on:
  push:
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      # 两个版本都要出结果，不能一个失败就取消其余
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm run verify

      - run: npm run build

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite:///./ci-commerce.db
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - run: python -m pip install -r requirements-dev.lock

      - run: python -m ruff check app migrations tests

      - run: python -m ruff format --check app migrations tests

      - run: python -m mypy

      - run: python -m alembic upgrade head

      - run: python -m alembic check

      - run: python -m pytest -q

      - run: python -m compileall -q app migrations tests

  postgres-commerce:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      COMMERCE_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/commerce_test
      AI_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/commerce_test
      AI_TEST_POSTGRES_TLS_URL: postgresql://postgres:postgres@localhost:5432/commerce_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: commerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      # COMMERCE_TEST_POSTGRES_URL adds PostgreSQL to the shared commerce tests.
      # Each test migrates/seeds a random schema and cleans up only its own schema.
      - run: python -m pytest -q
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        working-directory: .
      - name: Create isolated TypeScript migration database
        env:
          TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec "$TEST_POSTGRES_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE typescript_migrations_test"
      - name: Test TypeScript PostgreSQL migration locking
        env:
          AI_TEST_POSTGRES_MIGRATIONS_URL: postgresql://postgres:postgres@127.0.0.1:5432/typescript_migrations_test
        run: npm test -- src/db/postgres-migrations.integration.test.ts
        working-directory: .
      - run: npm test -- src/server/search/repository-postgres.integration.test.ts
        working-directory: .
      # Public, localhost-only fixture; never use these keys for a deployed server.
      - name: Configure disposable PostgreSQL TLS fixture
        working-directory: .
        env:
          TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          node -e "const fs = require('node:fs'); const f = require('./src/test/fixtures/postgres-tls.json'); fs.mkdirSync('.vitest/pg-tls', {recursive:true}); fs.writeFileSync('.vitest/pg-tls/server.crt', f.cert); fs.writeFileSync('.vitest/pg-tls/server.key', f.key);"
          docker cp .vitest/pg-tls/server.crt "$TEST_POSTGRES_CONTAINER:/tmp/server.crt"
          docker cp .vitest/pg-tls/server.key "$TEST_POSTGRES_CONTAINER:/tmp/server.key"
          docker exec "$TEST_POSTGRES_CONTAINER" chown postgres:postgres /tmp/server.crt /tmp/server.key
          docker exec "$TEST_POSTGRES_CONTAINER" chmod 600 /tmp/server.key
          docker exec "$TEST_POSTGRES_CONTAINER" psql -U postgres -d commerce_test -c "ALTER SYSTEM SET ssl_cert_file = '/tmp/server.crt'"
          docker exec "$TEST_POSTGRES_CONTAINER" psql -U postgres -d commerce_test -c "ALTER SYSTEM SET ssl_key_file = '/tmp/server.key'"
          docker exec "$TEST_POSTGRES_CONTAINER" psql -U postgres -d commerce_test -c "ALTER SYSTEM SET ssl = 'on'"
          # PostgreSQL is the container's main process: pg_ctl restart stops
          # the container and kills its own docker exec before it can start again.
          # Restart from the host so the fixture is loaded without losing the container.
          docker restart --time 10 "$TEST_POSTGRES_CONTAINER"
          for attempt in {1..20}; do
            if [ "$(docker exec "$TEST_POSTGRES_CONTAINER" pg_isready -U postgres -d commerce_test >/dev/null 2>&1; echo $?)" = 0 ] && \
              [ "$(docker exec "$TEST_POSTGRES_CONTAINER" psql -U postgres -d commerce_test -Atc 'SHOW ssl' | tr -d '\r')" = on ] && \
              [ "$(docker exec "$TEST_POSTGRES_CONTAINER" psql -U postgres -d commerce_test -Atc 'SHOW ssl_cert_file' | tr -d '\r')" = /tmp/server.crt ] && \
              [ "$(docker exec "$TEST_POSTGRES_CONTAINER" psql -U postgres -d commerce_test -Atc 'SHOW ssl_key_file' | tr -d '\r')" = /tmp/server.key ]; then
              exit 0
            fi
            sleep 0.2
          done
          exit 1
      - run: npm test -- src/db/postgres-tls.integration.test.ts
        working-directory: .
